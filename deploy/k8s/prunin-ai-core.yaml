apiVersion: apps/v1
kind: Deployment
metadata:
  name: prunin-ai-core
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: prunin-ai-core
  template:
    metadata:
      labels:
        app: prunin-ai-core
    spec:
      containers:
        - name: api
          image: prunin-ai-core:0.9.0-academic
          ports:
            - containerPort: 8000
          env:
            - name: PRUNIN_CORS_ORIGINS
              value: "https://prunin.example"
            - name: PRUNIN_ENABLE_OLLAMA
              value: "0"
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: prunin-ai-core
spec:
  selector:
    app: prunin-ai-core
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prunin-ai-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prunin-ai-core
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
