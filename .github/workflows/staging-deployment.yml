name: staging-deployment

# Deploy only on an explicitly provisioned, dedicated self-hosted staging runner.
# Never claim production or deploy academic source datasets/credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prunin-staging
  cancel-in-progress: false

jobs:
  deploy:
    environment: staging
    runs-on: [self-hosted, linux, prunin-staging]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate selected commit's reproducibility contract
        run: |
          python scripts/check_paiii_delivery_evidence.py
          python scripts/validate_original_promise.py --check
      - name: Verify runtime on staging host
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          test -d /opt/prunin-academic-artifacts/0.9.0-academic
          for filename in health.joblib delay_days.joblib cost_overrun_ratio.joblib; do
            test -s "/opt/prunin-academic-artifacts/0.9.0-academic/$filename"
          done
          test -f /opt/prunin-staging/config.env
      - name: Build immutable image tagged to commit
        run: docker build -f Dockerfile.playground -t "prunin-ai-core:${GITHUB_SHA}" .
      - name: Preflight candidate and promote with rollback
        env:
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: bash scripts/deploy_staging_safe.sh "prunin-ai-core:${COMMIT_SHA}"
