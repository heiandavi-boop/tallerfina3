name: quality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Static-check deployment and MLOps scripts
        run: |
          bash -n scripts/deploy_staging_safe.sh
          bash -n scripts/docker_two_replica_failover.sh
          bash -n scripts/verify_final_paiii.sh
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ("quality.yml", "staging-deployment.yml", "monitored-academic-batch.yml", "scheduled-demo-drift.yml"):
              obj = yaml.safe_load((Path(".github/workflows") / name).read_text(encoding="utf-8"))
              assert isinstance(obj, dict) and "jobs" in obj, name
          print("Workflow YAML parses successfully")
          PY
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Run frontend tests
        run: npm test --prefix frontend -- --reporter=dot
      - name: Create local demo-only artifacts for API tests
        run: ./scripts/run_demo.sh
      - name: Execute drift diagnostic on synthetic demo in CI
        run: |
          python scripts/check_drift.py \
            --artifact artifacts/demo-0.1.0 \
            --input data/processed/demo_core.csv \
            --batch data/processed/demo_core.csv \
            --profile-output ${{ runner.temp }}/prunin-demo-train-profile.json \
            --report-output ${{ runner.temp }}/prunin-demo-drift.json \
            > ${{ runner.temp }}/prunin-demo-drift-stdout.json
      - name: Archive CI demo drift diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-synthetic-drift-check
          path: ${{ runner.temp }}/prunin-demo-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate original promise KPI
        run: python scripts/validate_original_promise.py --check
      - name: Check PAIII rubric and evidence consistency
        run: python scripts/check_paiii_delivery_evidence.py
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run tests
        env:
          PYTHONPATH: src
          PRUNIN_ARTIFACT_DIR: artifacts/demo-0.1.0
        run: python -m pytest -q
      - name: Build and smoke container with synthetic demo models
        run: bash scripts/container_smoke.sh
      - name: Verify two-replica Docker load balancing and failover
        run: bash scripts/docker_two_replica_failover.sh
